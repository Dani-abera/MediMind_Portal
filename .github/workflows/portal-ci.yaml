name: MediMind Portal CI/CD

on:
  push:
    branches: [main]
    tags: ['v*.*.*']
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  FLUTTER_VERSION: '3.24.0'

jobs:
  # ── Build: Windows ────────────────────────────────────────────────────────
  build-windows:
    name: Build Windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build Windows (release)
        run: flutter build windows --release --obfuscate --split-debug-info=build/symbols
        env:
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
          ENV: production

      - name: Package with Inno Setup
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          choco install innosetup -y
          iscc /DAppVersion=${{ github.ref_name }} installer/windows/setup.iss

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: medimind-portal-windows
          path: build/windows/x64/runner/Release/

  # ── Build: macOS ──────────────────────────────────────────────────────────
  build-macos:
    name: Build macOS
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build macOS (release)
        run: flutter build macos --release --obfuscate --split-debug-info=build/symbols
        env:
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
          ENV: production

      - name: Strip FinderInfo xattr (required for codesign)
        run: |
          xattr -cr build/macos/Build/Products/Release/medimind_portal.app

      - name: Sign & notarize
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          echo "${{ secrets.MACOS_CERTIFICATE }}" | base64 --decode > certificate.p12
          security create-keychain -p "${{ secrets.KEYCHAIN_PASSWORD }}" build.keychain
          security import certificate.p12 -k build.keychain -P "${{ secrets.MACOS_CERTIFICATE_PASSWORD }}" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "${{ secrets.KEYCHAIN_PASSWORD }}" build.keychain
          codesign --deep --force --verify --verbose \
            --sign "${{ secrets.MACOS_IDENTITY }}" \
            --options runtime \
            build/macos/Build/Products/Release/medimind_portal.app
          # Package as DMG
          hdiutil create -volname "MediMind Portal" \
            -srcfolder build/macos/Build/Products/Release/medimind_portal.app \
            -ov -format UDZO \
            "MediMind-Portal-${{ github.ref_name }}.dmg"

      - name: Upload macOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: medimind-portal-macos
          path: build/macos/Build/Products/Release/

  # ── Build: Linux ──────────────────────────────────────────────────────────
  build-linux:
    name: Build Linux
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update -y
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev \
            liblzma-dev libstdc++-12-dev libglib2.0-dev

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build Linux (release)
        run: flutter build linux --release --obfuscate --split-debug-info=build/symbols
        env:
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
          ENV: production

      - name: Package as AppImage
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          wget -q https://github.com/AppImage/AppImageKit/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x appimagetool-x86_64.AppImage
          mkdir -p AppDir/usr/bin
          cp -r build/linux/x64/release/bundle/* AppDir/usr/bin/
          ./appimagetool-x86_64.AppImage AppDir "MediMind-Portal-${{ github.ref_name }}-x86_64.AppImage"

      - name: Upload Linux artifact
        uses: actions/upload-artifact@v4
        with:
          name: medimind-portal-linux
          path: build/linux/x64/release/bundle/

  # ── Release (on tag) ──────────────────────────────────────────────────────
  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: [build-windows, build-macos, build-linux]
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          name: MediMind Portal ${{ github.ref_name }}
          body_path: CHANGELOG.md
          files: |
            medimind-portal-windows/**
            medimind-portal-macos/**
            medimind-portal-linux/**
            *.AppImage
            *.dmg
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
