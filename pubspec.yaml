name: medimind_portal
description: MediMind Portal — Desktop app for Doctors, Admins, and SuperAdmins.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter

  # State management
  flutter_bloc: ^9.1.0
  bloc_concurrency: ^0.3.0
  equatable: ^2.0.7

  # DI
  get_it: ^9.1.1

  # Functional
  dartz: ^0.10.1

  # Networking
  dio: ^5.7.0
  pretty_dio_logger: ^1.4.0
  signalr_netcore: ^1.4.4
  connectivity_plus: ^6.1.2
  internet_connection_checker_plus: ^3.0.0

  # Storage & security
  flutter_secure_storage: ^9.2.4
  shared_preferences: ^2.3.3
  hive: ^2.2.3
  hive_flutter: ^1.1.0

  # Routing
  go_router: ^14.6.3
  page_transition: ^2.1.0

  # Forms
  reactive_forms: ^18.2.2
  pinput: ^6.0.2

  # Config
  flutter_dotenv: ^6.0.1

  # i18n
  intl: ^0.20.2
  easy_localization: ^3.0.8

  # Media
  cross_file: ^0.3.4+2
  image_picker: ^1.1.2
  file_picker: ^8.1.7
  cached_network_image: ^3.4.1
  flutter_svg: ^2.0.17

  # Charts
  fl_chart: ^1.2.0
  syncfusion_flutter_charts: ^33.2.4
  syncfusion_flutter_calendar: ^33.2.4
  syncfusion_flutter_pdfviewer: ^33.2.4
  syncfusion_flutter_pdf: ^33.2.4
  syncfusion_flutter_xlsio: ^33.2.4

  # Tables
  data_table_2: ^2.7.2
  pluto_grid: ^8.1.0

  # Video / Agora
  agora_rtc_engine: ^6.5.0
  agora_rtm: ^2.1.0

  # Phone input
  intl_phone_number_input: ^0.7.5

  # Chapa payment SDK
  chapasdk: ^0.0.8

  # Utilities
  url_launcher: ^6.3.1
  toastification: ^3.2.0
  shimmer: ^3.0.0
  font_awesome_flutter: ^10.8.0
  package_info_plus: ^8.3.0
  flutter_markdown_plus: ^1.0.7

  # Desktop window
  window_manager: ^0.5.1
  hotkey_manager: ^0.2.3
  contextual_menu: ^0.1.3
  tray_manager: ^0.5.2
  bitsdojo_window: ^0.1.6
  desktop_notifications: ^0.6.3
  flutter_acrylic: ^1.1.4

  # Maps
  flutter_map: ^8.3.0
  latlong2: ^0.9.1

  # Path provider (used by bootstrap)
  path_provider: ^2.1.5

  # Monitoring
  sentry_flutter: ^9.19.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  mocktail: ^1.0.4
  bloc_test: ^10.0.0
  build_runner: ^2.14.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/
    - assets/translations/
    - .env

  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Regular.ttf
        - asset: assets/fonts/Inter-Medium.ttf
          weight: 500
        - asset: assets/fonts/Inter-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Inter-Bold.ttf
          weight: 700
    - family: RobotoMono
      fonts:
        - asset: assets/fonts/RobotoMono-Regular.ttf
